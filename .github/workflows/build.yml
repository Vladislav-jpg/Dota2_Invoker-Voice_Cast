name: Build Windows EXE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vosk sounddevice keyboard mouse pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console --name "voice_invoke" voice_invoke.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Invoke-EXE
          path: dist/voice_invoke.exe
